<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">chatgpt-mcp multi-tunnel overview</title>
  <desc id="desc">Multiple OpenAI Secure MCP Tunnel clients terminate at one shared local tools.Runtime. Each tunnel keeps its own runtime key, session namespace, reconnect and readiness state, while workspaces, tools, approvals, upstream MCP servers, plugins and local control surfaces remain shared.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .node { fill: #ffffff; stroke: #94a3b8; }
    .node-main { fill: #eff6ff; stroke: #3b82f6; }
    .node-secure { fill: #ecfdf5; stroke: #10b981; }
    .node-cloud { fill: #f5f3ff; stroke: #8b5cf6; }
    .node-muted { fill: #f8fafc; stroke: #cbd5e1; }
    .node-admin { fill: #fff7ed; stroke: #f59e0b; }
    .text { fill: #0f172a; font: 600 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sub { fill: #64748b; font: 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #475569; font: 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #0f172a; font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .05em; }
    .boundary { fill: none; stroke: #94a3b8; stroke-dasharray: 6 6; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
    .flow-main { stroke: #2563eb; stroke-width: 2.2; }
    .flow-secure { stroke: #10b981; stroke-width: 2; }
    .flow-optional { stroke-dasharray: 5 5; }
    .flow-admin { stroke: #d97706; stroke-width: 1.7; }
    .badge { fill: #dbeafe; }
    .badge-text { fill: #1d4ed8; font: 600 10px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #f8fafc; stroke: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1120; }
      .panel, .note { fill: #0f172a; stroke: #334155; }
      .node { fill: #111827; stroke: #64748b; }
      .node-main { fill: #172554; stroke: #60a5fa; }
      .node-secure { fill: #052e2b; stroke: #34d399; }
      .node-cloud { fill: #2e1065; stroke: #a78bfa; }
      .node-muted { fill: #111827; stroke: #475569; }
      .node-admin { fill: #451a03; stroke: #fbbf24; }
      .text, .heading { fill: #f8fafc; }
      .sub, .label { fill: #94a3b8; }
      .boundary { stroke: #475569; }
      .flow { stroke: #94a3b8; }
      .flow-main { stroke: #60a5fa; }
      .flow-secure { stroke: #34d399; }
      .flow-admin { stroke: #fbbf24; }
      .badge { fill: #1e3a8a; }
      .badge-text { fill: #bfdbfe; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect class="bg" width="1320" height="760" rx="18"/>

  <text class="text" x="36" y="38" font-size="18">Multi-tunnel, one shared runtime</text>
  <text class="sub" x="36" y="60">N independent OpenAI tunnel clients feed the same local tools.Runtime.</text>

  <rect class="panel" x="240" y="66" width="1060" height="561" rx="18"/>
  <text class="label" x="264" y="90">YOUR MACHINE</text>

  <rect class="boundary" x="1090" y="66" width="210" height="241" rx="16"/>
  <text class="label" x="1110" y="88">WORKSPACE BOUNDARY</text>

  <rect class="node" x="40" y="285" width="150" height="68" rx="12"/>
  <text class="text" x="115" y="313" text-anchor="middle">ChatGPT Apps</text>
  <text class="sub" x="115" y="334" text-anchor="middle">one or more MCP clients</text>

  <rect class="node-cloud" x="260" y="285" width="190" height="88" rx="12"/>
  <text class="text" x="355" y="315" text-anchor="middle">Secure MCP Tunnels</text>
  <text class="sub" x="355" y="336" text-anchor="middle">Tunnel A / B / N</text>
  <rect class="badge" x="317" y="347" width="76" height="18" rx="9"/>
  <text class="badge-text" x="355" y="360" text-anchor="middle">OPENAI</text>

  <rect class="node-main" x="560" y="285" width="175" height="88" rx="12"/>
  <text class="text" x="647.5" y="315" text-anchor="middle">Tunnel Manager</text>
  <text class="sub" x="647.5" y="336" text-anchor="middle">N independent clients</text>
  <text class="sub" x="647.5" y="356" text-anchor="middle">reconcile / reconnect / status</text>

  <rect class="node-main" x="850" y="285" width="175" height="88" rx="12"/>
  <text class="text" x="937.5" y="315" text-anchor="middle">tools.Runtime</text>
  <text class="sub" x="937.5" y="336" text-anchor="middle">single shared runtime</text>
  <rect class="badge" x="900" y="347" width="75" height="18" rx="9"/>
  <text class="badge-text" x="937.5" y="360" text-anchor="middle">ONE INSTANCE</text>

  <rect class="node-secure" x="1110" y="90" width="170" height="72" rx="11"/>
  <text class="text" x="1195" y="120" text-anchor="middle">Registered Workspaces</text>
  <text class="sub" x="1195" y="142" text-anchor="middle">explicit ws_* scopes</text>

  <rect class="node-secure" x="1110" y="215" width="170" height="72" rx="11"/>
  <text class="text" x="1195" y="245" text-anchor="middle">Filesystem / Shell / Git</text>
  <text class="sub" x="1195" y="267" text-anchor="middle">workspace-bound tools</text>

  <rect class="node-muted" x="1110" y="410" width="170" height="72" rx="11"/>
  <text class="text" x="1195" y="440" text-anchor="middle">Upstream MCP Servers</text>
  <text class="sub" x="1195" y="462" text-anchor="middle">shared aggregation</text>

  <rect class="node-muted" x="1110" y="535" width="170" height="72" rx="11"/>
  <text class="text" x="1195" y="565" text-anchor="middle">Plugins / Hooks</text>
  <text class="sub" x="1195" y="587" text-anchor="middle">shared tool registry</text>

  <rect class="node" x="555" y="535" width="185" height="72" rx="11"/>
  <text class="text" x="647.5" y="565" text-anchor="middle">CLI / TUI / Admin</text>
  <text class="sub" x="647.5" y="587" text-anchor="middle">local control surfaces</text>

  <rect class="node-admin" x="260" y="535" width="190" height="72" rx="11"/>
  <text class="text" x="355" y="565" text-anchor="middle">Admin Profiles</text>
  <text class="sub" x="355" y="587" text-anchor="middle">management credentials</text>

  <path class="flow flow-main" d="M190 319 H260"/>
  <text class="label" x="225" y="307" text-anchor="middle">MCP</text>
  <path class="flow flow-secure" d="M450 329 H560"/>
  <text class="label" x="505" y="317" text-anchor="middle">N outbound clients</text>
  <path class="flow flow-main" d="M735 329 H850"/>
  <text class="label" x="792.5" y="317" text-anchor="middle">namespaced sessions</text>

  <path class="flow" d="M1025 308 H1067.5 V126 H1110"/>
  <text class="label" x="1077" y="116">resolve scope</text>
  <path class="flow" d="M1025 322 H1067.5 V251 H1110"/>
  <path class="flow flow-optional" d="M1025 336 H1067.5 V446 H1110"/>
  <path class="flow flow-optional" d="M1025 350 H1067.5 V571 H1110"/>

  <path class="flow" d="M647.5 535 V373"/>
  <text class="label" x="659" y="462">attach / detach / lifecycle</text>
  <path class="flow flow-admin" d="M555 571 H450"/>
  <text class="label" x="502.5" y="559" text-anchor="middle">profile operations</text>
  <path class="flow flow-admin" d="M355 535 V373"/>
  <text class="label" x="367" y="470">discover / manage only</text>

  <rect class="note" x="36" y="660" width="390" height="68" rx="12"/>
  <text class="heading" x="54" y="684">ONE RUNTIME</text>
  <text class="sub" x="54" y="705">All tunnel ingress reuses the same workspaces, tools, approvals,</text>
  <text class="sub" x="54" y="721">processes, upstream MCP servers and plugins.</text>

  <rect class="note" x="465" y="660" width="390" height="68" rx="12"/>
  <text class="heading" x="483" y="684">PER-TUNNEL ISOLATION</text>
  <text class="sub" x="483" y="705">Runtime key, session namespace, reconnect loop, readiness, metadata</text>
  <text class="sub" x="483" y="721">and error state remain independent for each tunnel.</text>

  <rect class="note" x="894" y="660" width="390" height="68" rx="12"/>
  <text class="heading" x="912" y="684">SEPARATE MANAGEMENT PLANE</text>
  <text class="sub" x="912" y="705">Multiple admin profiles may manage remote tunnels; admin keys never</text>
  <text class="sub" x="912" y="721">replace the per-tunnel runtime credentials.</text>
</svg>
