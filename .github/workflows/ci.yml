name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs:
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Install security tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Static analysis
        run: staticcheck ./...

      - name: Security analysis
        run: gosec -quiet -exclude=G204,G301,G302,G304,G306,G702,G703,G705 ./...

      - name: Workflow lint
        run: actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Installer lint
        run: shellcheck install.sh

  native:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: chatgpt-mcp
          - name: Windows
            runner: windows-latest
            binary: chatgpt-mcp.exe
          - name: macOS
            runner: macos-latest
            binary: chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Verify modules
        run: go mod verify

      - name: Local install smoke
        run: node scripts/install-local.mjs --from-dist

      - name: Package alias smoke
        run: node --test scripts/prepare-package-aliases.test.mjs

      - name: Test
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-test
        run: go test ./...

      - name: Race test
        if: matrix.name == 'Linux'
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-race-test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Runtime smoke
        run: node scripts/smoke-release.mjs ./dist-smoke/${{ matrix.binary }}

  cross-build:
    name: Cross build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs:
      - native
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Verify modules
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o chatgpt-mcp ./
