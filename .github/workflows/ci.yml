name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs:
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Install security tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Verify tidy module metadata
        run: go mod tidy -diff

      - name: Static analysis
        run: staticcheck ./...

      - name: Security analysis
        run: |
          gosec -quiet -fmt=json ./... > "${RUNNER_TEMP}/gosec.json" || true
          node scripts/check-gosec-baseline.mjs "${RUNNER_TEMP}/gosec.json" scripts/gosec-baseline.json

      - name: Go coverage gate
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-coverage-test
        run: |
          go test -coverprofile="${RUNNER_TEMP}/coverage.out" ./...
          coverage=$(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 64.0) { print "Go coverage must be at least 64.0%" > "/dev/stderr"; exit 1 } }'

      - name: Workflow lint
        run: actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Installer lint
        run: shellcheck install.sh

  native:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: chatgpt-mcp
          - name: Windows
            runner: windows-latest
            binary: chatgpt-mcp.exe
          - name: macOS
            runner: macos-latest
            binary: chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-install-ps1.ps1

      - name: Validate Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/test-install-ps1.ps1

      - name: Verify modules
        run: go mod verify

      - name: Local install smoke
        run: node scripts/install-local.mjs --from-dist

      - name: Package alias smoke
        run: node --test scripts/prepare-package-aliases.test.mjs

      - name: Updater integration
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-updater-test
        run: |
          go test ./internal/update -run 'TestUpdater|TestPolicyForInstallation'
          go test ./internal/cli -run 'TestCoordinateUpdatedRuntime|TestRestartManagedRuntime'

      - name: Control approval smoke
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-approval-test
        run: go test -count=1 ./internal/approval ./internal/tools ./internal/cli ./internal/admin

      - name: TUI release gate
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-tui-test
        run: go test -count=1 -run 'Test(ParseRoute|RunRejectsNonTTYWithoutWritingANSI|EveryPublicCapabilityHasTUIRepresentation|MappedCapabilitiesArePaletteDiscoverableByCanonicalCLIPath|ModelRendersDeepLinkAndNavigation|ModelOpensAndRunsCommandPalette|ModelQuickOpenNavigatesPage)$' ./internal/tui

      - name: Test
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-test
        run: go test ./...

      - name: Race test
        if: matrix.name == 'Linux'
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-race-test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Runtime smoke
        run: node scripts/smoke-release.mjs ./dist-smoke/${{ matrix.binary }}

  cross-build:
    name: Cross build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs:
      - native
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Verify modules
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o chatgpt-mcp ./
