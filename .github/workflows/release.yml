name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to current main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          main_sha=$(git rev-parse origin/main)
          if [ "${GITHUB_SHA}" != "${main_sha}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but origin/main is ${main_sha}."
            exit 1
          fi

  web:
    name: Web release checks
    runs-on: ubuntu-latest
    needs:
      - verify-tag
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error

  security:
    name: Release security checks
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Install security tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Verify tidy module metadata
        run: go mod tidy -diff

      - name: Static analysis
        run: staticcheck ./...

      - name: Security analysis
        run: |
          gosec -quiet -fmt=json ./... > "${RUNNER_TEMP}/gosec.json" || true
          node scripts/check-gosec-baseline.mjs "${RUNNER_TEMP}/gosec.json" scripts/gosec-baseline.json

      - name: Go coverage gate
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-coverage-test
        run: |
          go test -coverprofile="${RUNNER_TEMP}/coverage.out" ./...
          coverage=$(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 64.0) { print "Go coverage must be at least 64.0%" > "/dev/stderr"; exit 1 } }'

      - name: Workflow lint
        run: actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Installer lint
        run: shellcheck install.sh

  native:
    name: Release native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: chatgpt-mcp
          - name: Windows
            runner: windows-latest
            binary: chatgpt-mcp.exe
          - name: macOS
            runner: macos-latest
            binary: chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Verify modules
        run: go mod verify

      - name: Updater integration
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-updater-test
        run: |
          go test ./internal/update -run 'TestUpdater|TestPolicyForInstallation'
          go test ./internal/cli -run 'TestCoordinateUpdatedRuntime|TestRestartManagedRuntime'

      - name: Control approval smoke
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-approval-test
        run: go test -count=1 ./internal/approval ./internal/tools ./internal/cli ./internal/admin

      - name: TUI release gate
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-tui-test
        run: go test -count=1 -run 'Test(ParseRoute|RunRejectsNonTTYWithoutWritingANSI|EveryPublicCapabilityHasTUIRepresentation|MappedCapabilitiesArePaletteDiscoverableByCanonicalCLIPath|ModelRendersDeepLinkAndNavigation|ModelOpensAndRunsCommandPalette|ModelQuickOpenNavigatesPage)$' ./internal/tui

      - name: Test
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-test
        run: go test ./...

      - name: Race test
        if: matrix.name == 'Linux'
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-race-test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Runtime smoke
        run: node scripts/smoke-release.mjs ./dist-smoke/${{ matrix.binary }}

      - name: Package alias smoke
        run: node --test scripts/prepare-package-aliases.test.mjs

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - verify-tag
      - web
      - security
      - native
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs --from-dist

      - name: Verify modules
        run: go mod verify

      - name: Verify clean module metadata
        run: git diff --exit-code -- go.mod go.sum

      - name: Install UPX
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4.0.0
        with:
          version: 'v5.2.0'
          install-only: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare package aliases
        run: |
          node scripts/prepare-package-aliases.mjs
          node scripts/prepare-package-aliases.mjs --check

      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/chatgpt-mcp.json
          test -f dist/homebrew/Casks/chatgpt-mcp.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/chatgpt-mcp.json \
            dist/homebrew/Casks/chatgpt-mcp.rb \
            --clobber

      - name: Trigger package manager sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_SYNC_TOKEN is not configured; skipping Homebrew/Scoop sync."
            exit 0
          fi
          payload=$(jq -n \
            --arg name "chatgpt-mcp" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{event_type:"sync-package",client_payload:{name:$name,tag:$tag}}')
          for repo in homebrew-mew scoop-mew; do
            echo "$payload" | gh api "repos/${{ github.repository_owner }}/${repo}/dispatches" --input -
            echo "Dispatched sync-package to ${{ github.repository_owner }}/${repo} (${GITHUB_REF_NAME})"
          done
