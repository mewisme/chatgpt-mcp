name: Official Plugins

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-plugins
  cancel-in-progress: false

jobs:
  registry:
    name: Publish registry metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Prepare registry
        run: |
          mkdir -p dist/plugins
          cp plugins/registry/index.json dist/plugins/index.json
          cp plugins/registry/publishers.json dist/plugins/publishers.json
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq --arg generated_at "$generated_at" '.generated_at = $generated_at' dist/plugins/index.json > dist/plugins/index.tmp
          mv dist/plugins/index.tmp dist/plugins/index.json
          go run ./scripts/validate-plugin-registry.go dist/plugins/index.json dist/plugins/publishers.json

      - name: Sign registry
        run: |
          cosign sign-blob --yes --bundle dist/plugins/index.json.sigstore.json dist/plugins/index.json
          cosign sign-blob --yes --bundle dist/plugins/publishers.json.sigstore.json dist/plugins/publishers.json

      - name: Verify fixed marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --tags origin refs/tags/plugins >/dev/null 2>&1; then
            echo "::error::The fixed plugins tag does not exist. Create it once before publishing the marketplace."
            exit 1
          fi
          if ! gh release view plugins >/dev/null 2>&1; then
            gh release create plugins --title "Official Plugins" --notes "Official ChatGPT MCP plugin marketplace assets."
          fi

      - name: Publish mutable registry assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload plugins \
            dist/plugins/index.json \
            dist/plugins/index.json.sigstore.json \
            dist/plugins/publishers.json \
            dist/plugins/publishers.json.sigstore.json \
            --clobber
