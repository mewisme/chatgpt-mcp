name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  native:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: chatgpt-mcp
          - name: Windows
            runner: windows-latest
            binary: chatgpt-mcp.exe
          - name: macOS
            runner: macos-latest
            binary: chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Verify modules
        run: go mod verify

      - name: Local install smoke
        run: node scripts/install-local.mjs --from-dist

      - name: Package alias smoke
        run: node --test scripts/prepare-package-aliases.test.mjs

      - name: Test
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-test
        run: go test ./...

      - name: Race test
        if: matrix.name == 'Linux'
        env:
          CHATGPT_MCP_CONFIG_DIR: ${{ runner.temp }}/chatgpt-mcp-go-race-test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Runtime smoke
        run: node scripts/smoke-release.mjs ./dist-smoke/${{ matrix.binary }}

  cross-build:
    name: Cross build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs:
      - native
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Verify modules
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o chatgpt-mcp ./
