name: Official Plugins

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-plugins
  cancel-in-progress: false

jobs:
  definitions:
    name: Resolve plugin definitions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate plugin workflow definitions
        run: |
          node scripts/plugin-workflow.mjs validate
          node --test scripts/plugin-workflow.test.mjs

      - name: Generate matrices
        id: matrix
        shell: bash
        run: |
          echo "build=$(node scripts/plugin-workflow.mjs matrix build)" >> "$GITHUB_OUTPUT"
          echo "smoke=$(node scripts/plugin-workflow.mjs matrix smoke)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: definitions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.definitions.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Build plugin
        run: node scripts/plugin-workflow.mjs build "${{ matrix.id }}" dist/plugins

      - name: Upload plugin build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.id }}
          path: dist/plugins/${{ matrix.id }}-*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish official marketplace
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download plugin builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plugin-*
          path: dist/plugins
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Prepare registry
        shell: bash
        run: |
          set -euo pipefail
          cp plugins/registry/index.json dist/plugins/index.json
          cp plugins/registry/publishers.json dist/plugins/publishers.json
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq --arg generated_at "$generated_at" '.generated_at = $generated_at' dist/plugins/index.json > dist/plugins/index.tmp
          mv dist/plugins/index.tmp dist/plugins/index.json
          go run ./scripts/validate-plugin-registry.go dist/plugins/index.json dist/plugins/publishers.json dist/plugins
          : > dist/plugins/immutable-assets.txt
          while IFS= read -r manifest; do
            printf '%s\n' "$manifest" >> dist/plugins/immutable-assets.txt
            while IFS= read -r artifact; do
              [ -n "$artifact" ] && printf 'dist/plugins/%s\n' "$artifact" >> dist/plugins/immutable-assets.txt
            done < <(jq -r '.platforms[] | .artifact // empty' "$manifest")
          done < <(find dist/plugins -maxdepth 1 -type f -name '*.json' ! -name 'index.json' ! -name 'publishers.json' ! -name '*.sigstore.json' | sort)
          sort -u -o dist/plugins/immutable-assets.txt dist/plugins/immutable-assets.txt
          if [ ! -s dist/plugins/immutable-assets.txt ]; then
            echo "::error::No immutable plugin assets were prepared."
            exit 1
          fi

      - name: Ensure fixed marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --tags origin refs/tags/plugins >/dev/null 2>&1; then
            git tag plugins "${GITHUB_SHA}"
            git push origin refs/tags/plugins
          fi
          if ! gh release view plugins >/dev/null 2>&1; then
            gh release create plugins --verify-tag --title "Official Plugins" --notes "Official ChatGPT MCP plugin marketplace assets."
          fi

      - name: Verify immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/plugins/existing
          : > dist/plugins/upload-immutable.txt
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            name=$(basename "$asset")
            existing="dist/plugins/existing/$name"
            if gh release download plugins --pattern "$name" --dir dist/plugins/existing >/dev/null 2>&1; then
              if ! cmp --silent "$asset" "$existing"; then
                echo "::error::Immutable plugin asset $name already exists with different content."
                exit 1
              fi
              echo "Immutable asset already published identically: $name"
            else
              printf '%s\n' "$asset" >> dist/plugins/upload-immutable.txt
            fi
          done < dist/plugins/immutable-assets.txt

      - name: Sign immutable assets when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > dist/plugins/upload-signatures.txt
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            name=$(basename "$asset")
            signature="$asset.sigstore.json"
            signature_name="$name.sigstore.json"
            if gh release download plugins --pattern "$signature_name" --dir dist/plugins/existing >/dev/null 2>&1; then
              echo "Signature already published: $signature_name"
              continue
            fi
            cosign sign-blob --yes --bundle "$signature" "$asset"
            printf '%s\n' "$signature" >> dist/plugins/upload-signatures.txt
          done < dist/plugins/immutable-assets.txt

      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(cat dist/plugins/upload-immutable.txt dist/plugins/upload-signatures.txt | sed '/^$/d')
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload plugins "${assets[@]}"
          else
            echo "All immutable plugin assets are already published."
          fi

      - name: Sign mutable registry
        run: |
          cosign sign-blob --yes --bundle dist/plugins/index.json.sigstore.json dist/plugins/index.json
          cosign sign-blob --yes --bundle dist/plugins/publishers.json.sigstore.json dist/plugins/publishers.json

      - name: Publish mutable registry assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload plugins \
            dist/plugins/index.json \
            dist/plugins/index.json.sigstore.json \
            dist/plugins/publishers.json \
            dist/plugins/publishers.json.sigstore.json \
            --clobber

  smoke:
    name: Smoke ${{ matrix.id }}
    needs:
      - definitions
      - publish
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.definitions.outputs.smoke) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install, verify, and smoke plugin
        run: node scripts/plugin-workflow.mjs smoke "${{ matrix.id }}"
