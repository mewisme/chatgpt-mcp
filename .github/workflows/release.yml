name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error

  native:
    name: Release native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: chatgpt-mcp
          - name: Windows
            runner: windows-latest
            binary: chatgpt-mcp.exe
          - name: macOS
            runner: macos-latest
            binary: chatgpt-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Runtime smoke
        run: node scripts/smoke-release.mjs ./dist-smoke/${{ matrix.binary }}

      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - web
      - native
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist

      - name: Prepare web embed
        run: node scripts/prepare-web-embed.mjs

      - name: Verify modules
        run: go mod verify

      - name: Verify clean module metadata
        run: git diff --exit-code -- go.mod go.sum

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/chatgpt-mcp.json
          test -f dist/homebrew/Casks/chatgpt-mcp.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/chatgpt-mcp.json \
            dist/homebrew/Casks/chatgpt-mcp.rb \
            --clobber

      - name: Trigger package manager sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_SYNC_TOKEN is not configured; skipping Homebrew/Scoop sync."
            exit 0
          fi
          payload=$(jq -n \
            --arg name "chatgpt-mcp" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{event_type:"sync-package",client_payload:{name:$name,tag:$tag}}')
          for repo in homebrew-mew scoop-mew; do
            echo "$payload" | gh api "repos/${{ github.repository_owner }}/${repo}/dispatches" --input -
            echo "Dispatched sync-package to ${{ github.repository_owner }}/${repo} (${GITHUB_REF_NAME})"
          done
